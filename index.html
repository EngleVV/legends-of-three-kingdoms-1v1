<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>三国杀 1v1</title>
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
  <link rel="stylesheet" href="src/ui/style.css">
</head>
<body>
  <div id="setup"></div>
  <div id="game" class="hidden">
    <!-- 左：牌桌 -->
    <div id="table">
      <div id="opp-row" class="player-row"></div>
      <div id="center-row">
        <div id="deck-info"></div>
        <div id="field" data-zone="field"></div>
      </div>
      <div id="self-row" class="player-row is-self"></div>
      <div id="banner"></div>
      <div id="hand-row" data-zone="hand"></div>
      <!-- 选牌面板（顺/拆/反馈/麒麟弓、五谷丰登、观星），浮于牌桌中央 -->
      <div id="picker" class="hidden"></div>
    </div>
    <!-- 右：战报 -->
    <aside id="side">
      <div id="side-title">战 报</div>
      <div id="log"></div>
    </aside>
  </div>
  <!-- 全局特效层：卡牌飞行幽灵 / 伤害飘字 / 回合横幅（不拦截点击） -->
  <div id="fx-layer"></div>
  <script type="module" src="src/ui/app.js"></script>
</body>
</html>
